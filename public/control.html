<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontrol Timer Panggung</title>
<style>
  :root {
    --bg: #0f1114; --panel: #181b20; --line: #2a2f37; --text: #e9ebee; --mute: #8b929c;
    --ok: #f4f4f0; --warn: #ffb300; --alert: #ff4438; --go: #2fbf71; --accent: #ffb300;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 "Segoe UI", system-ui, Roboto, Arial, sans-serif; padding: 20px; }
  main { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: 1.15fr 1fr; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--mute); }
  .col { display: grid; gap: 16px; align-content: start; }

  #live { text-align: center; padding: 22px 16px; }
  #big { font-size: clamp(64px, 12vw, 120px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.02em; color: var(--ok); }
  #big.warn { color: var(--warn); } #big.alert, #big.over { color: var(--alert); }
  #big.font-sans { font-family: "Bahnschrift", "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif; }
  #big.font-condensed { font-family: "Impact", "Arial Narrow", "Haettenschweiler", sans-serif; }
  #big.font-mono { font-family: "Consolas", "Courier New", "Liberation Mono", Menlo, monospace; }
  #big.font-serif { font-family: "Georgia", "Times New Roman", Times, serif; }
  #big.font-digital { font-family: "Courier New", monospace; letter-spacing: .05em; text-shadow: 0 0 10px currentColor; }
  #status { margin-top: 8px; color: var(--mute); }
  #prog { height: 6px; background: var(--line); border-radius: 3px; margin-top: 14px; overflow: hidden; }
  #prog > i { display: block; height: 100%; width: 100%; background: var(--ok); transform-origin: left; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--text); background: #222730; border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 14px; cursor: pointer; min-height: 40px;
  }
  button:hover { background: #2b313b; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--go); border-color: var(--go); color: #06210f; font-weight: 700; flex: 2; font-size: 17px; min-height: 52px; }
  button.primary.running { background: var(--warn); border-color: var(--warn); color: #2b1d00; }
  button.big { flex: 1; min-height: 52px; }
  button.on { background: var(--alert); border-color: var(--alert); color: #fff; }
  input[type=text], input[type=number] {
    font: inherit; color: var(--text); background: #0f1114; border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; min-height: 40px; width: 100%;
  }
  .time-in { display: flex; gap: 8px; align-items: center; }
  .time-in input { width: 80px; text-align: center; font-variant-numeric: tabular-nums; }
  label { color: var(--mute); font-size: 13px; }
  button.active-opt { background: #3b4352; border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .grid4 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sub { color: var(--mute); font-size: 13px; margin-top: 8px; }
  #conn { font-size: 13px; color: var(--mute); display: flex; align-items: center; gap: 6px; }
  #conn i { width: 9px; height: 9px; border-radius: 50%; background: #f33; display: inline-block; }
  #conn.ok i { background: var(--go); }
  header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 700; }
  a { color: var(--accent); }
  kbd { background: #222730; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kontrol timer panggung</h1>
    <div class="row" style="align-items:center">
      <span id="conn"><i></i><span>Menghubungkan…</span></span>
      <button id="openDisplay">Buka layar display</button>
      <button id="copyLink">Salin link display</button>
    </div>
  </header>

  <div class="col">
    <section id="live">
      <div id="big">00:00</div>
      <div id="status">Siap</div>
      <div id="prog"><i></i></div>
    </section>

    <section>
      <div class="row">
        <button id="toggle" class="primary">Mulai</button>
        <button id="reset" class="big">Reset</button>
      </div>
      <p class="sub">Pintasan: <kbd>Spasi</kbd> mulai/jeda, <kbd>R</kbd> reset, <kbd>B</kbd> layar hitam</p>
    </section>

    <section>
      <h2>Tambah atau kurangi waktu</h2>
      <div class="grid4">
        <button data-adj="-300000">−5 menit</button>
        <button data-adj="-60000">−1 menit</button>
        <button data-adj="-10000">−10 detik</button>
        <button data-adj="300000">+5 menit</button>
        <button data-adj="60000">+1 menit</button>
        <button data-adj="10000">+10 detik</button>
      </div>
    </section>
  </div>

  <div class="col">
    <section>
      <h2>Atur durasi</h2>
      <div class="time-in">
        <input id="inM" type="number" min="0" max="999" value="10" aria-label="Menit"><span>:</span>
        <input id="inS" type="number" min="0" max="59" value="00" aria-label="Detik">
        <button id="setBtn">Pasang</button>
      </div>
      <div class="row" style="margin-top:12px" id="presets"></div>
    </section>

    <section>
      <h2>Pesan untuk pembicara</h2>
      <input id="msgIn" type="text" maxlength="200" placeholder="Ketik pesan lalu tekan Enter">
      <div class="row" style="margin-top:8px">
        <button id="sendMsg">Tampilkan</button>
        <button id="clearMsg">Hapus pesan</button>
      </div>
      <div class="row" style="margin-top:8px" id="quick"></div>
    </section>

    <section>
      <h2>Layar dan warna</h2>
      <div class="row">
        <button id="blackout">Layar hitam</button>
      </div>
      <div style="margin-top:12px">
        <label>Pilihan Jenis Font Timer</label>
        <div class="row" style="margin-top:6px" id="fontOpts">
          <button data-font="sans">Modern Sans</button>
          <button data-font="condensed">Tinggi / Bold</button>
          <button data-font="mono">Monospace</button>
          <button data-font="serif">Serif Clasic</button>
          <button data-font="digital">Digital Kalkulator</button>
        </div>
      </div>
      <div style="margin-top:12px">
        <label for="overIn">Teks saat waktu habis</label>
        <div class="row" style="margin-top:4px">
          <input id="overIn" type="text" maxlength="50" value="WAKTU HABIS" style="flex:1">
          <button id="saveOver">Simpan</button>
        </div>
      </div>
      <div class="row" style="margin-top:12px; align-items:end">
        <div style="flex:1"><label for="warnIn">Kuning saat sisa (menit)</label><input id="warnIn" type="number" min="0" step="0.5"></div>
        <div style="flex:1"><label for="alertIn">Merah saat sisa (menit)</label><input id="alertIn" type="number" min="0" step="0.5"></div>
        <button id="thBtn">Simpan</button>
      </div>
    </section>
  </div>
</main>

<script src="common.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let first = true;

  const t = connectTimer((st, ok) => {
    $('conn').classList.toggle('ok', ok);
    $('conn').lastElementChild.textContent = ok ? 'Terhubung' : 'Terputus, mencoba lagi…';
    if (!st) return;
    $('toggle').textContent = st.running ? 'Jeda' : 'Mulai';
    $('toggle').classList.toggle('running', st.running);
    $('blackout').classList.toggle('on', st.blackout);
    $('blackout').textContent = st.blackout ? 'Layar hitam aktif, klik untuk nyalakan' : 'Layar hitam';
    document.querySelectorAll('#fontOpts button').forEach((b) => {
      b.classList.toggle('active-opt', b.dataset.font === (st.fontFamily || 'sans'));
    });
    if (document.activeElement !== $('msgIn') && first) $('msgIn').value = st.message;
    if (document.activeElement !== $('overIn') && first) $('overIn').value = st.overText || 'WAKTU HABIS';
    if (first) {
      $('warnIn').value = st.warnMs / 60000;
      $('alertIn').value = st.alertMs / 60000;
      $('inM').value = Math.floor(st.durationMs / 60000);
      $('inS').value = String(Math.floor((st.durationMs % 60000) / 1000)).padStart(2, '0');
      first = false;
    }
  });

  function frame() {
    const st = t.state;
    if (st) {
      const ms = t.remaining();
      const z = zoneOf(ms, st);
      const fontCls = 'font-' + (st.fontFamily || 'sans');
      $('big').textContent = formatTime(ms);
      $('big').className = `${z} ${fontCls}`;
      $('status').textContent = ms <= 0 ? 'Waktu habis, sudah lewat ' + formatTime(-ms).replace('−', '') : (st.running ? 'Berjalan' : 'Dijeda');
      const frac = st.durationMs > 0 ? Math.max(0, Math.min(1, ms / st.durationMs)) : 0;
      const bar = $('prog').firstElementChild;
      bar.style.transform = `scaleX(${frac})`;
      bar.style.background = z === 'ok' ? 'var(--ok)' : z === 'warn' ? 'var(--warn)' : 'var(--alert)';
    }
    requestAnimationFrame(frame);
  }
  frame();

  // tombol utama
  $('toggle').onclick = () => t.send({ type: 'toggle' });
  $('reset').onclick = () => t.send({ type: 'reset' });
  document.querySelectorAll('[data-adj]').forEach((b) => b.onclick = () => t.send({ type: 'adjust', ms: +b.dataset.adj }));

  // font
  document.querySelectorAll('#fontOpts button').forEach((b) => {
    b.onclick = () => t.send({ type: 'font', font: b.dataset.font });
  });

  // durasi
  function setDur(ms) { t.send({ type: 'set', ms }); }
  $('setBtn').onclick = () => setDur(((+$('inM').value || 0) * 60 + (+$('inS').value || 0)) * 1000);
  [1, 3, 5, 10, 15, 20, 30, 45, 60].forEach((m) => {
    const b = document.createElement('button');
    b.textContent = m + ' mnt';
    b.onclick = () => { $('inM').value = m; $('inS').value = '00'; setDur(m * 60000); };
    $('presets').appendChild(b);
  });

  // pesan
  const sendMsg = () => t.send({ type: 'message', text: $('msgIn').value });
  $('sendMsg').onclick = sendMsg;
  $('msgIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });
  $('clearMsg').onclick = () => { $('msgIn').value = ''; t.send({ type: 'message', text: '' }); };
  ['Segera akhiri', 'Waktu habis', 'Tanya jawab', 'Turun panggung'].forEach((q) => {
    const b = document.createElement('button');
    b.textContent = q;
    b.onclick = () => { $('msgIn').value = q; t.send({ type: 'message', text: q }); };
    $('quick').appendChild(b);
  });

  // layar & warna
  $('blackout').onclick = () => t.send({ type: 'blackout', on: !t.state?.blackout });
  const saveOver = () => t.send({ type: 'overText', text: $('overIn').value.trim() || 'WAKTU HABIS' });
  $('saveOver').onclick = saveOver;
  $('overIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveOver(); });
  $('thBtn').onclick = () => t.send({ type: 'thresholds', warnMs: (+$('warnIn').value || 0) * 60000, alertMs: (+$('alertIn').value || 0) * 60000 });

  // link display
  const displayUrl = location.origin + '/display.html';
  $('openDisplay').onclick = () => window.open(displayUrl, '_blank');
  $('copyLink').onclick = async () => {
    try { await navigator.clipboard.writeText(displayUrl); $('copyLink').textContent = 'Tersalin'; }
    catch { prompt('Salin link ini:', displayUrl); }
    setTimeout(() => $('copyLink').textContent = 'Salin link display', 1500);
  };

  // pintasan keyboard
  document.addEventListener('keydown', (e) => {
    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); t.send({ type: 'toggle' }); }
    else if (e.key.toLowerCase() === 'r') t.send({ type: 'reset' });
    else if (e.key.toLowerCase() === 'b') $('blackout').click();
  });
</script>
</body>
</html>
